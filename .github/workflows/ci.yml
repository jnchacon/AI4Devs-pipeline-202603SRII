name: CI/CD Pipeline

on:
  push:
    branches:
      - pipeline-JCM

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Run tests (Smoke test)
        working-directory: ./backend
        run: npm run test

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Generate build
        working-directory: ./backend
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            backend/prisma
            backend/.env

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/dist,backend/package.json,backend/package-lock.json,backend/prisma,backend/.env"
          target: "~/app"

      - name: Execute deployment commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Instalar Node.js y PM2 en el servidor si no existen
            if ! type node > /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
              sudo npm install -g pm2
            fi
            
            # Instalar dependencias de produccion y arrancar
            cd ~/app/backend
            npm install --production
            npx prisma generate
            pm2 restart backend || pm2 start dist/index.js --name backend
            
            # Health check: esperamos a que arranque y probamos
            sleep 5
            if ! curl -s http://localhost:3010 > /dev/null; then
              echo "Error: La aplicación falló al arrancar. Mostrando los logs de error:"
              pm2 logs backend --lines 20 --nostream
              exit 1
            fi
            echo "¡Despliegue exitoso y aplicación respondiendo!"
